<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;  
        }

        .container {
            width: 960px;
            height: 300px;
            display: flex;
            border: 2px solid black;
            gap: 20px;
        }
        
        .box1, .box2, .box3 {
            width: 300px;
            height: 300px;
            display: flex;
            border: 1px solid red
        }
        .box1 {
            background-color: lightgrey;
        }
        .box2 {
            background-color: lightblue;
        }
        .box3 {
            background-color: lightcyan;
        }
        .box1 img, .box2 img, .box3 img {
            height: 300px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" img src="" alt="">box1</div>
        <div class="box" img src="" alt="">box2</div>
        <div class="box" img src="" alt="">box3</div>
    </div>q
</body>
</html>
